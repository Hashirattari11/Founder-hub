[project]
name = "founderhub-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn==0.30.0",
    "supabase>=2.31.0",
    "python-dotenv==1.0.1",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "PyJWT>=2.13.0",
    "resend>=2.35.0",
    "websockets>=14",
    "python-multipart==0.0.9",
    "anthropic>=0.49.0",
    "openai>=1.58.0",
    "cryptography>=43.0.0",
    "requests>=2.32.0",
]

[tool.vercel.scripts]
build = "cd frontend && npm ci && npm run build && rm -rf node_modules"